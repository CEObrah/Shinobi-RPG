name: OOC DEV Legacy Lineage Audit

on:
  push:
    branches:
      - fix/legacy-lineage-audit

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/legacy-lineage-audit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[service,service-test]'

      - name: Apply bounded lineage probe
        run: python tools/ooc_dev_patch_legacy_lineage.py

      - name: Prove no campaign state edits
        run: git diff --exit-code -- state

      - name: Focused regressions
        run: |
          pytest -q \
            tests/current/test_ooc_wal_combat_provenance.py \
            tests/current/test_transaction_git.py \
            tests/current/test_forward_campaign_repair.py \
            tests/current/test_wal_campaign_repair.py

      - name: Repository gates
        run: |
          python tools/quick_check.py
          python tools/verify_jianghu_semantics.py
          python tools/audit_state_bloat.py
          python tools/verify_noop_roundtrip.py

      - name: Changed-owner regression gate
        run: |
          python tools/test_changed.py \
            runtime/shinobi_runtime/tx/git.py \
            runtime/shinobi_runtime/api/ooc.py \
            tests/current/test_ooc_wal_combat_provenance.py

      - name: Commit only tested product changes
        run: |
          rm -f tools/ooc_dev_patch_legacy_lineage.py .github/workflows/ooc-dev-legacy-lineage.yml
          git config user.name 'Shinobi OOC DEV'
          git config user.email 'ooc-dev@invalid'
          git add -A
          git diff --cached --exit-code -- state
          git commit -m 'Add severed world-lineage audit'
          git push origin HEAD:fix/legacy-lineage-audit
