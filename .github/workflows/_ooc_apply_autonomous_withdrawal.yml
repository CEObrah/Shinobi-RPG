name: Apply autonomous withdrawal source patch

on:
  push:
    branches:
      - fix/autonomous-combat-withdrawal-20260829

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply exact-combat patch
        run: python tools/_ooc_patch_autonomous_withdrawal.py
      - name: Validate patched source
        run: |
          python -m py_compile runtime/shinobi_runtime/martial_world/exact_combat.py tests/current/test_exact_combat_withdrawal.py
          git diff --check
      - name: Commit source and remove temporary patch machinery
        run: |
          git rm .github/workflows/_ooc_apply_autonomous_withdrawal.yml tools/_ooc_patch_autonomous_withdrawal.py
          git add runtime/shinobi_runtime/martial_world/exact_combat.py tests/current/test_exact_combat_withdrawal.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Implement autonomous combat withdrawal'
          git push origin HEAD:${{ github.ref_name }}
