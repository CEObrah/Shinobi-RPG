[build]
builder = "RAILPACK"
watchPatterns = [
  "/runtime/**",
  "/game/**",
  "/pyproject.toml",
  "/requirements.txt",
  "/railway.toml"
]

[deploy]
startCommand = "PYTHONPATH=/app/runtime python -m shinobi_runtime.bootstrap"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
drainingSeconds = 30
