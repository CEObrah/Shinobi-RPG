name: remove-superseded-structure
on:
  push:
    branches:
      - maintenance/validator-bloat-cleanup
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - name: Remove obsolete structures
        run: python tools/remove_superseded_structure.py
      - name: Validate repository
        run: |
          python tools/test_transaction_integrity.py
          python tools/test_state_consolidation.py
          python tools/test_population_model.py
          python tools/test_world_liveness.py
          python tools/test_commitment_liveness.py
          python tools/audit.py
          python tools/test_gameplay_naming.py
          python tools/test_development.py
          python tools/test_mechanics.py
          python tools/test_living_world.py
          python tools/test_runtime.py
          python tools/test_semantics.py
          python tools/test_unit_model.py
          python tools/test_reputation.py
          python tools/test_family.py
          python tools/test_team_consistency.py
          python tools/test_house_tang_martial.py
          python tools/test_templates.py
          python tools/test_structural_determinism.py
          python tools/test_routing.py
      - name: Commit validated cleanup
        run: |
          rm tools/remove_superseded_structure.py
          rm tools/report_superseded_structure.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove superseded structural files"
          git push origin HEAD:maintenance/validator-bloat-cleanup
