name: Apply OOC combat repair

on:
  push:
    branches:
      - fix/combat-lethal-pursuit-exhaustion-narration

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/combat-lethal-pursuit-exhaustion-narration

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply targeted source repair
        run: python tools/ooc_apply_combat_fix.py

      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[service,service-test]'

      - name: Run focused regressions
        run: python -m pytest -q tests/current/test_combat_lethal_pursuit_repair.py tests/current/test_combat_command_wrapper.py

      - name: Fast repository gate
        run: |
          python tools/quick_check.py
          git diff --check

      - name: Commit repaired source to branch
        shell: bash
        run: |
          git config user.name 'Shinobi OOC Repair'
          git config user.email 'ooc-repair@invalid'
          git add -A
          git commit -m 'Fix lethal pursuit, exhaustion, and combat narration'
          git push origin HEAD:fix/combat-lethal-pursuit-exhaustion-narration
