name: Gameplay Version Collision Classification

on:
  push:
    branches:
      - maintenance/stable-gameplay-names

jobs:
  classify:
    if: ${{ !contains(github.event.head_commit.message, '[version-classification]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/report_gameplay_version_identifiers.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maintenance/gameplay-version-classification.json
          git commit -m "[version-classification] Classify gameplay version collisions"
          git push origin HEAD:maintenance/stable-gameplay-names
