name: OOC Dev Melee Release Origin Final

on:
  push:
    branches: [fix/melee-release-origin-provenance]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply release-origin and provenance repair
        run: |
          python tools/ooc_dev_patch_melee_release_origin.py
          python tools/ooc_dev_patch_melee_release_origin_followup.py
          python tools/ooc_dev_patch_melee_release_origin_followup2.py
      - name: Remove temporary OOC DEV scaffolding
        run: rm tools/ooc_dev_patch_melee_release_origin.py tools/ooc_dev_patch_melee_release_origin_followup.py tools/ooc_dev_patch_melee_release_origin_followup2.py tools/ooc_dev_patch_melee_release_origin_diagnostic.py .github/workflows/ooc-dev-melee-release-origin-final.yml
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[service,service-test]'
      - name: Focused combat regressions
        run: python -m pytest -q tests/current/test_combat_contact_pursuit_repair.py tests/current/test_combat_geometry.py tests/current/test_combat_command_wrapper.py tests/current/test_combat_lethal_pursuit_repair.py
      - name: Fast repository gate
        run: python tools/quick_check.py
      - name: Changed-owner regressions
        run: >-
          python tools/test_changed.py
          runtime/shinobi_runtime/martial_world/exact_combat.py
          tests/current/test_combat_contact_pursuit_repair.py
      - name: Commit verified repair
        run: |
          git config user.name 'OpenAI OOC Dev'
          git config user.email 'ooc-dev@invalid'
          git add -A
          git commit -m 'Fix melee release origin and team provenance'
          git push origin HEAD:${GITHUB_REF_NAME}
