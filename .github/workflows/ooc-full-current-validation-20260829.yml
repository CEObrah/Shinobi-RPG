name: OOC Final Withdrawal Validation 20260829

on:
  push:
    branches:
      - fix/autonomous-combat-withdrawal-20260829
    paths:
      - .github/workflows/ooc-full-current-validation-20260829.yml

permissions:
  contents: write

jobs:
  baseline-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[service,service-test]'
      - name: Record main full-suite baseline
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/current
          rc=$?
          echo "MAIN_FULL_SUITE_EXIT=$rc"
          exit 0

  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/autonomous-combat-withdrawal-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Exclude future reinforcements from retreat geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('runtime/shinobi_runtime/martial_world/exact_combat.py')
          text = path.read_text(encoding='utf-8')
          marker = '\ndef _npc_withdrawal_decision(*, combat: Mapping[str, Any], actor_ref: str, people: Mapping[str, Mapping[str, Any]], faction_doctrine: Mapping[str, Any] | None) -> dict[str, Any] | None:\n'
          helper = '''\ndef _present_body_refs(combat: Mapping[str, Any]) -> list[str]:
              """Return bodies that are physically present on the combat field."""
              states = combat.get("combatants", {}) if isinstance(combat.get("combatants"), Mapping) else {}
              positions = combat.get("positions", {}) if isinstance(combat.get("positions"), Mapping) else {}
              body: list[str] = []
              for refs in combat.get("sides", {}).values():
                  for ref in refs:
                      if not isinstance(ref, str) or ref not in positions:
                          continue
                      state = states.get(ref)
                      statuses = {str(x) for x in state.get("status_families", []) if isinstance(x, str)} if isinstance(state, Mapping) else set()
                      if "reinforcing" in statuses:
                          continue
                      body.append(ref)
              return body

          '''
          if '_present_body_refs' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('withdrawal marker mismatch')
              text = text.replace(marker, helper + marker, 1)
          old = 'body=[str(ref) for refs in combat.get("sides",{}).values() for ref in refs if isinstance(ref,str) and ref in combat.get("positions",{})]'
          count = text.count(old)
          if count not in {0, 2}:
              raise SystemExit(f'unexpected retreat body expression count: {count}')
          if count == 2:
              text = text.replace(old, 'body=_present_body_refs(combat)', 2)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/current/test_exact_combat_withdrawal.py')
          tests = test_path.read_text(encoding='utf-8')
          test_name = 'test_future_reinforcement_is_not_a_physical_retreat_obstacle'
          if test_name not in tests:
              tests += '''\n\ndef test_future_reinforcement_is_not_a_physical_retreat_obstacle(monkeypatch):
              base=load('state/martial-world/people/house_tang.json')['people'][0]
              actor=person(base,'reinforce-geometry.actor','faction.actor'); enemy=person(base,'reinforce-geometry.enemy','faction.enemy'); future=person(base,'reinforce-geometry.future','faction.enemy')
              people={row['person_id']:row for row in (actor,enemy,future)}; gear=ledger(*people)
              combat=initialize_combat(combat_ref='withdraw-reinforce-geometry',side_a_refs=[actor['person_id']],side_b_refs=[enemy['person_id'],future['person_id']],people=people,zone_ref='site.house_tang',started_at='x',objective={'kind':'eliminate'},equipment_ledger=gear,reinforcement_delays_ms={future['person_id']:60_000})
              combat['positions'][actor['person_id']].update(x_mm=0,y_mm=0); combat['positions'][enemy['person_id']].update(x_mm=1200,y_mm=0); combat['positions'][future['person_id']].update(x_mm=-1000,y_mm=0)
              seen={}
              def corridors(positions,*,actor_ref,body_refs,obstacles):
                  seen['corridors']=list(body_refs)
                  return [{'angle_mdeg':180000,'end_x_mm':-8000,'end_y_mm':0}]
              def clear(positions,*,actor_ref,end_x_mm,end_y_mm,body_refs,obstacles):
                  seen['path']=list(body_refs)
                  return True
              monkeypatch.setattr(exact,'open_retreat_corridors',corridors); monkeypatch.setattr(exact,'path_clear',clear)
              result=attempt_disengage(combat=combat,actor_ref=actor['person_id'],people=people,equipment_ledger=gear)
              assert result['movement']['duration_ms']==1000
              assert future['person_id'] not in seen['corridors']
              assert future['person_id'] not in seen['path']
              assert actor['person_id'] in seen['corridors'] and enemy['person_id'] in seen['corridors']
          '''
          test_path.write_text(tests, encoding='utf-8')
          PY
      - run: python -m pip install -e '.[service,service-test]'
      - run: python tools/quick_check.py
      - run: >-
          python tools/test_changed.py
          runtime/shinobi_runtime/martial_world/exact_combat.py
          tests/current/test_combat_geometry.py
          tests/current/test_exact_combat_withdrawal.py
          tests/current/test_health_targeting.py
          tests/current/test_mounted_combat.py
      - run: python -m pytest -q tests/current/test_exact_combat_withdrawal.py tests/current/test_combat_geometry.py tests/current/test_health_targeting.py tests/current/test_mounted_combat.py
      - run: git diff --check
      - name: Commit validated repair
        shell: bash
        run: |
          if git diff --quiet -- runtime/shinobi_runtime/martial_world/exact_combat.py tests/current/test_exact_combat_withdrawal.py; then
            echo 'No repair diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/shinobi_runtime/martial_world/exact_combat.py tests/current/test_exact_combat_withdrawal.py
          git commit -m 'Ignore pending reinforcements in retreat geometry'
          git push origin HEAD:fix/autonomous-combat-withdrawal-20260829