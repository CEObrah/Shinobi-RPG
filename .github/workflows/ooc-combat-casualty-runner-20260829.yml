name: OOC combat casualty projection runner

on:
  push:
    branches:
      - fix/combat-casualty-projection-20260829

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply casualty projection repair
        run: python tools/ooc_patch_combat_casualty.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fast repository gate
        run: python tools/quick_check.py
      - name: Changed-system regression selection
        run: python tools/test_changed.py runtime/shinobi_runtime/martial_world/exact_combat.py runtime/shinobi_runtime/api/travel_operations.py tests/current/test_combat_casualty_projection.py tests/current/test_combat_observation_projection.py tests/current/test_combat_presence_projection.py tests/current/test_combat_geometry.py plugins/shinobi-rpg/skill/shinobi-game-master/references/combat.md
      - name: Focused casualty projection tests
        run: python -m pytest -q tests/current/test_combat_casualty_projection.py tests/current/test_combat_observation_projection.py tests/current/test_combat_presence_projection.py tests/current/test_combat_geometry.py
      - name: Diff hygiene
        run: git diff --check
      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/shinobi_runtime/martial_world/exact_combat.py runtime/shinobi_runtime/api/travel_operations.py tests/current/test_combat_casualty_projection.py plugins/shinobi-rpg/skill/shinobi-game-master/references/combat.md
          git diff --cached --quiet && exit 0
          git commit -m "Fix exact-combat casualty projection"
          git push origin HEAD:${GITHUB_REF_NAME}
