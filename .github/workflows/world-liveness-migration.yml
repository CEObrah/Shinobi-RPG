name: world-liveness-migration
on:
  push:
    branches:
      - maintenance/world-liveness-pass
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/migrate_world_liveness.py
      - name: Commit deterministic migration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate general autonomous scheduling"
          git push origin HEAD:maintenance/world-liveness-pass
