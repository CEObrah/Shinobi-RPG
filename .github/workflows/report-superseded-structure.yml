name: report-superseded-structure
on:
  push:
    branches:
      - maintenance/validator-bloat-cleanup
jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/report_superseded_structure.py
