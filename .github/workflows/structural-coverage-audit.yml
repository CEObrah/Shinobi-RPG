name: Structural Coverage Inventory

on:
  push:
    branches:
      - maintenance/stable-gameplay-names

jobs:
  inventory:
    if: ${{ !contains(github.event.head_commit.message, '[structural-coverage-report]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build structural coverage report
        run: python tools/report_structural_coverage.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maintenance/structural-coverage.json
          git commit -m "[structural-coverage-report] Inventory mutable owner structures"
          git push origin HEAD:maintenance/stable-gameplay-names
