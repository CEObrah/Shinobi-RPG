name: OOC Full Current Validation 20260829

on:
  push:
    branches:
      - fix/autonomous-combat-withdrawal-20260829
    paths:
      - .github/workflows/ooc-full-current-validation-20260829.yml

permissions:
  contents: read

jobs:
  full-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/autonomous-combat-withdrawal-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[service,service-test]'
      - run: python tools/quick_check.py
      - run: >-
          python tools/test_changed.py
          runtime/shinobi_runtime/martial_world/exact_combat.py
          tests/current/test_combat_geometry.py
          tests/current/test_exact_combat_withdrawal.py
          tests/current/test_health_targeting.py
          tests/current/test_mounted_combat.py
      - run: python -m pytest -q tests/current
      - run: git diff --check
