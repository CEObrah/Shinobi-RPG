name: audit
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[service,service-test]' jsonschema
      - run: python tools/test_transaction_integrity.py
      - run: python tools/test_clan_catalog.py
      - run: python tools/test_templates.py
      - run: python tools/test_routing.py
      - run: python tools/test_causal_world_state.py
      - run: python tools/test_state_consolidation.py
      - run: python tools/test_population_model.py
      - run: python tools/test_person_model.py
      - run: python tools/test_canon.py
      - run: python tools/test_canon_pressures.py
      - run: python tools/test_world_liveness.py
      - run: python tools/test_world_events.py
      - run: python tools/test_commitment_liveness.py
      - run: python tools/audit.py
      - run: python tools/test_gameplay_naming.py
      - run: python tools/test_development.py
      - run: python tools/test_mechanics.py
      - run: python tools/test_living_world.py
      - run: python tools/test_runtime.py
      - run: python tools/test_semantics.py
      - run: python tools/test_formation_model.py
      - run: python tools/test_reputation.py
      - run: python tools/test_family.py
      - run: python tools/test_team_consistency.py
      - run: python tools/test_house_tang_martial.py
      - run: python tools/run_acceptance_harness.py
      - run: python -m pytest tests/runtime -q
      - run: git diff --check HEAD^ HEAD
