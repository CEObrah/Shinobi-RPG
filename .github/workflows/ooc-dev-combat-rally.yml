name: OOC Dev Combat Rally Repair

on:
  push:
    branches: [fix/combat-rally-approach-budget]

permissions:
  contents: write

concurrency:
  group: ooc-dev-combat-rally-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/combat-rally-approach-budget
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply rally and approach repair
        run: python tools/ooc_dev_patch_combat_rally.py

      - name: Remove temporary patch scaffolding
        run: rm tools/ooc_dev_patch_combat_rally.py .github/workflows/ooc-dev-combat-rally.yml

      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[service,service-test]'

      - name: Focused combat regressions
        run: |
          pytest -q tests/current/test_combat_rally_and_approach_budget.py
          pytest -q tests/current/test_combat_geometry.py tests/current/test_combat_lethal_pursuit_repair.py tests/current/test_combat_span_safety.py
          pytest -q tests/current/test_shinobi_game_master_combat_presentation.py

      - name: Fast repository gate
        run: python tools/quick_check.py

      - name: Changed-owner regressions
        run: python tools/test_changed.py game/data/martial-world/combat.json runtime/shinobi_runtime/commands/specs.py runtime/shinobi_runtime/commands/jianghu_extended.py runtime/shinobi_runtime/martial_world/exact_combat.py plugins/shinobi-rpg/skill/shinobi-game-master/references/combat.md tests/current/test_combat_rally_and_approach_budget.py

      - name: Commit verified repair
        run: |
          git config user.name 'CEObrah'
          git config user.email '107764892+CEObrah@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix combat rally and melee approach budget'
          git push origin HEAD:fix/combat-rally-approach-budget
