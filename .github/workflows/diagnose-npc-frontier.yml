name: Diagnose NPC frontier

on:
  push:
    branches:
      - fix/live-npc-judgment-handoff
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[service,service-test]'
      - name: Reproduce live NPC frontier
        run: python -m pytest -q tests/current/test_live_npc_judgment_handoff.py -vv
