name: report-file-size-guards
on:
  push:
    branches:
      - maintenance/validator-bloat-cleanup
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/report_file_size_guards.py
