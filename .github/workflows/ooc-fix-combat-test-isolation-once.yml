name: OOC Fix Combat Test Isolation Once

on:
  push:
    branches:
      - fix/autonomous-combat-withdrawal-20260829
    paths:
      - tools/_ooc_fix_combat_test_isolation.py
      - .github/workflows/ooc-fix-combat-test-isolation-once.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/autonomous-combat-withdrawal-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[service,service-test]'
      - run: python tools/_ooc_fix_combat_test_isolation.py
      - run: >-
          python -m pytest -q
          tests/current/test_combat_geometry.py
          tests/current/test_health_targeting.py
          tests/current/test_mounted_combat.py
          tests/current/test_exact_combat_withdrawal.py
      - run: python tools/quick_check.py
      - run: git diff --check
      - name: Commit repair and remove one-time tooling
        run: |
          rm tools/_ooc_fix_combat_test_isolation.py
          rm .github/workflows/ooc-fix-combat-test-isolation-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Isolate combat tests from mutable campaign state'
          git push origin HEAD:fix/autonomous-combat-withdrawal-20260829
