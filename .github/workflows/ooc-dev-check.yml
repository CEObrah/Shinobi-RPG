name: OOC DEV checks

on:
  pull_request:
  push:
    branches:
      - fix/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[service-test]'
      - name: Quick structural and command checks
        run: python tools/quick_check.py
      - name: Resolved route contact regressions
        run: >-
          pytest -q
          tests/current/test_resolved_route_contact_reconciliation.py
          tests/current/test_live_combat_route_rebase.py
          tests/current/test_semantic_wait_and_time_flow.py
          tests/current/test_runtime_invariants.py
          tests/current/test_release_surface.py
