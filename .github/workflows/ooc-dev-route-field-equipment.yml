name: OOC DEV Route Field Equipment

on:
  push:
    branches: [fix/systemic-route-field-equipment-20260831]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/systemic-route-field-equipment-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[service,service-test]'
      - name: Apply route field equipment patch
        run: python tools/_ooc_dev_route_field_equipment_patch.py
      - name: Prove no campaign-state edits
        run: |
          if git diff --name-only | grep -q '^state/'; then
            echo 'Refusing source repair with state edits.' >&2
            git diff --name-only >&2
            exit 1
          fi
      - name: Focused equipment and route regressions
        run: |
          pytest -q \
            tests/current/test_route_field_equipment_materialization.py \
            tests/current/test_route_interception_motive.py \
            tests/current/test_live_combat_route_rebase.py \
            tests/current/test_escort_living_world.py
      - name: Repository gates
        run: |
          python tools/quick_check.py
          python tools/verify_jianghu_semantics.py
          python tools/audit_state_bloat.py
          python tools/verify_noop_roundtrip.py
      - name: Changed-owner regression gate
        run: |
          python tools/test_changed.py \
            runtime/shinobi_runtime/martial_world/operational_equipment.py \
            runtime/shinobi_runtime/martial_world/route_frontier.py \
            tests/current/test_route_field_equipment_materialization.py
      - name: Commit only tested product changes
        shell: bash
        run: |
          rm -f tools/_ooc_dev_route_field_equipment_patch.py .github/workflows/ooc-dev-route-field-equipment.yml
          git diff --check
          if git diff --name-only | grep -q '^state/'; then
            echo 'State edit appeared before commit.' >&2
            exit 1
          fi
          git config user.name 'Shinobi OOC DEV'
          git config user.email 'ooc-dev@invalid'
          git add -A
          git commit -m 'Fix systemic route field equipment custody'
          git push origin HEAD:fix/systemic-route-field-equipment-20260831
