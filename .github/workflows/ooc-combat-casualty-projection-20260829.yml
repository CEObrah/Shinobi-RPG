name: OOC combat casualty projection repair

on:
  push:
    branches:
      - fix/combat-casualty-projection-20260829

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch observer-safe casualty projection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def between(text: str, start: str, end: str, replacement: str) -> str:
              i = text.index(start)
              j = text.index(end, i)
              return text[:i] + replacement + text[j:]

          exact_path = Path('runtime/shinobi_runtime/martial_world/exact_combat.py')
          exact = exact_path.read_text()
          if 'def _observed_status_snapshot(' not in exact:
              helper = '''\n\ndef _observed_status_snapshot(person: Mapping[str, Any], state: Mapping[str, Any]) -> list[str]:
              """Return the last directly observable combat condition for one body."""
              statuses = {str(x) for x in state.get("status_families", []) if isinstance(x, str)}
              health = person.get("health", {}) if isinstance(person.get("health"), Mapping) else {}
              health_status = str(health.get("status") or "")
              if health_status == "dead":
                  statuses.add("dead")
              elif health_status == "incapacitated":
                  statuses.add("incapacitated")
              if int(health.get("consciousness", 100)) <= 0 and health_status != "dead":
                  statuses.add("unconscious")
              if health_status == "injured" or _wounds(person):
                  statuses.add("wounded")
              return sorted(statuses)
          '''
              exact = exact.replace('\n\ndef initialize_combat', helper + '\n\ndef initialize_combat', 1)
              old = 'enemy_refs=list(b if ref in a else a); observed=enemy_refs if awareness_mode=="mutual" else []'
              new = 'enemy_refs=list(b if ref in a else a); arrived_enemy_refs=[enemy for enemy in enemy_refs if max(0,int(reinforcements.get(enemy,0)))==0]; observed=arrived_enemy_refs if awareness_mode=="mutual" else []'
              assert old in exact
              exact = exact.replace(old, new, 1)
              old = 'if not surprised and awareness_mode!="mutual": observed=enemy_refs'
              new = 'if not surprised and awareness_mode!="mutual": observed=arrived_enemy_refs'
              assert old in exact
              exact = exact.replace(old, new, 1)
              old = 'nearest=min((planar_distance_mm(positions[ref],positions[enemy]) for enemy in enemy_refs),default=0)'
              new = 'nearest=min((planar_distance_mm(positions[ref],positions[enemy]) for enemy in arrived_enemy_refs),default=0)'
              assert old in exact
              exact = exact.replace(old, new, 1)
              old = '"observed_refs":([] if reinforce>0 else observed),"awareness_confidence_milli"'
              new = '"observed_refs":([] if reinforce>0 else observed),"observed_status_families":({} if reinforce>0 else {enemy:_observed_status_snapshot(people[enemy],{}) for enemy in observed}),"awareness_confidence_milli"'
              assert old in exact
              exact = exact.replace(old, new, 1)

              observe = '''def _observe_visible_enemies(combat: dict[str, Any], *, actor_ref: str, enemy_refs: Sequence[str], people: Mapping[str, Mapping[str, Any]], at_ms: int) -> list[str]:
              state=combat["combatants"][actor_ref]; known=set(str(x) for x in state.get("observed_refs",[]) if isinstance(x,str)); actor_cap=capability_from_person(people[actor_ref])
              snapshots_raw=state.get("observed_status_families",{}); snapshots=dict(snapshots_raw) if isinstance(snapshots_raw,Mapping) else {}
              for enemy_ref in enemy_refs:
                  if enemy_ref not in people or enemy_ref not in combat.get("positions",{}): continue
                  if not line_of_sight_clear(combat["positions"],actor_ref=actor_ref,target_ref=enemy_ref,obstacles=combat.get("obstacles",[])): continue
                  enemy_state=combat["combatants"].get(enemy_ref,{})
                  enemy_cap=capability_from_person(people[enemy_ref]); distance_m=planar_distance_mm(combat["positions"][actor_ref],combat["positions"][enemy_ref])/1000.0
                  stealth_contribution=enemy_cap.stealth*3 if _active(people[enemy_ref],enemy_state) else 0
                  concealment=max(0,int(enemy_state.get("concealment_milli",0))+stealth_contribution)
                  visibility=max(200,min(1200,int((combat.get("environment") or {}).get("visibility_milli",1000)))) if isinstance(combat.get("environment"),Mapping) else 1000
                  detection=(actor_cap.perception*5+actor_cap.reaction*2-int(distance_m*5))*visibility//1000
                  if detection>=concealment:
                      known.add(enemy_ref)
                      snapshots[enemy_ref]=_observed_status_snapshot(people[enemy_ref],enemy_state)
              state["observed_refs"]=sorted(known)
              state["observed_status_families"]={ref:list(snapshots[ref]) for ref in sorted(snapshots) if ref in known and isinstance(snapshots.get(ref),list)}
              if known: state["awareness_confidence_milli"]=1000; state["surprise_milli"]=max(0,int(state.get("surprise_milli",0))-max(200,at_ms//5))
              return sorted(known & set(enemy_refs))
          '''
              exact = between(exact, 'def _observe_visible_enemies(', '\n\ndef _refresh_team_plan', observe)

              refresh = '''def _refresh_team_plan(combat: dict[str, Any], *, side: str, people: Mapping[str, Mapping[str, Any]], doctrine: Mapping[str, Any] | None) -> dict[str, Any]:
              members=[ref for ref in combat["sides"][side] if _active(people[ref],combat["combatants"][ref])]; other="side_b" if side=="side_a" else "side_a"; at_ms=int(combat.get("elapsed_ms",0))
              enemy_members=[ref for ref in combat["sides"][other] if ref in people and ref in combat.get("combatants",{})]
              enemies=[ref for ref in enemy_members if _active(people[ref],combat["combatants"][ref])]
              enemy_set=set(enemies); observable=[]
              for ref in enemy_members:
                  state=combat["combatants"][ref]; statuses={str(x) for x in state.get("status_families",[]) if isinstance(x,str)}
                  if {"escaped","ring_out"}&statuses: continue
                  if "reinforcing" in statuses and at_ms<max(0,int(state.get("reinforcement_at_ms",0))): continue
                  if ref in combat.get("positions",{}): observable.append(ref)
              known:set[str]=set()
              for member in members:
                  seen=_observe_visible_enemies(combat,actor_ref=member,enemy_refs=observable,people=people,at_ms=at_ms)
                  known.update(ref for ref in seen if ref in enemy_set)
              previous=combat.get("team_plans",{}).get(side); reasons=replan_reasons(previous,active_member_refs=members,known_enemy_refs=sorted(known),positions=combat["positions"],objective_kind=str(combat.get("objective",{}).get("kind","eliminate")))
              if reasons:
                  plan=plan_team_exchange(side_ref=side,member_refs=members,known_enemy_refs=sorted(known),records=people,positions=combat["positions"],obstacles=combat.get("obstacles",[]),objective_kind=str(combat.get("objective",{}).get("kind","eliminate")),doctrine=doctrine,at_ms=at_ms); plan["replan_reasons"]=list(reasons); combat.setdefault("team_plans",{})[side]=plan
              return combat.get("team_plans",{}).get(side,{})
          '''
              exact = between(exact, 'def _refresh_team_plan(', '\n\ndef _ready_team_assignment', refresh)

              old = '''        if "reinforcing" in statuses and now_ms>=max(0,int(state.get("reinforcement_at_ms",0))):
                      state["status_families"]=[x for x in statuses if x!="reinforcing"]
                      enemy_side="side_b" if _side_of(out,str(ref))=="side_a" else "side_a"
                      state["observed_refs"]=[str(x) for x in out.get("sides",{}).get(enemy_side,[])]
                      state["awareness_confidence_milli"]=1000
          '''
              new = '''        if "reinforcing" in statuses and now_ms>=max(0,int(state.get("reinforcement_at_ms",0))):
                      state["status_families"]=[x for x in statuses if x!="reinforcing"]
                      enemy_side="side_b" if _side_of(out,str(ref))=="side_a" else "side_a"
                      arrived_enemies=[]
                      for enemy_ref in out.get("sides",{}).get(enemy_side,[]):
                          enemy_state=out.get("combatants",{}).get(enemy_ref,{})
                          enemy_statuses={str(x) for x in enemy_state.get("status_families",[]) if isinstance(x,str)} if isinstance(enemy_state,Mapping) else set()
                          if {"escaped","ring_out"}&enemy_statuses: continue
                          if "reinforcing" in enemy_statuses and now_ms<max(0,int(enemy_state.get("reinforcement_at_ms",0))): continue
                          arrived_enemies.append(str(enemy_ref))
                      state["observed_refs"]=arrived_enemies
                      state["observed_status_families"]={enemy_ref:_observed_status_snapshot(persons[enemy_ref],out["combatants"].get(enemy_ref,{})) for enemy_ref in arrived_enemies if enemy_ref in persons}
                      state["awareness_confidence_milli"]=1000
          '''
              assert old in exact
              exact = exact.replace(old, new, 1)

              old = '''    if decision.detected:
                      known=set(str(x) for x in defender_state.get("observed_refs",[]) if isinstance(x,str)); known.add(actor_ref); defender_state["observed_refs"]=sorted(known); defender_state["surprise_milli"]=0
          '''
              new = '''    if decision.detected:
                      known=set(str(x) for x in defender_state.get("observed_refs",[]) if isinstance(x,str)); known.add(actor_ref); defender_state["observed_refs"]=sorted(known); defender_state["surprise_milli"]=0
                      snapshots=defender_state.get("observed_status_families",{}); snapshots=dict(snapshots) if isinstance(snapshots,Mapping) else {}; snapshots[actor_ref]=_observed_status_snapshot(people[actor_ref],actor_state); defender_state["observed_status_families"]=snapshots
          '''
              assert old in exact
              exact = exact.replace(old, new, 1)

              old = '''        if defender["health"].get("status") in {"dead","incapacitated"}:
                          statuses=set(defender_state.get("status_families",[])); status="dead" if defender["health"].get("status")=="dead" else "incapacitated"; statuses.add(status); defender_state["status_families"]=sorted(statuses); defender_state.setdefault("incapacitated_at_ms",at_ms)
          '''
              new = '''        if defender["health"].get("status") in {"dead","incapacitated"}:
                          statuses=set(defender_state.get("status_families",[])); status="dead" if defender["health"].get("status")=="dead" else "incapacitated"; statuses.add(status); defender_state["status_families"]=sorted(statuses); defender_state.setdefault("incapacitated_at_ms",at_ms)
                      snapshots=actor_state.get("observed_status_families",{}); snapshots=dict(snapshots) if isinstance(snapshots,Mapping) else {}; snapshots[actual_ref]=_observed_status_snapshot(defender,defender_state); actor_state["observed_status_families"]=snapshots
          '''
              assert old in exact
              exact = exact.replace(old, new, 1)
              exact_path.write_text(exact)

          travel_path = Path('runtime/shinobi_runtime/api/travel_operations.py')
          travel = travel_path.read_text()
          if 'player_hostile_status_observation' not in travel:
              projection = '''def combat_observation_scene_projection(
              *,
              read_json: Callable[[str], Any],
              player_id: str,
              ally_limit: int = 16,
          ) -> dict[str, Any] | None:
              """Project active friendlies, physical bodies, and observer-safe hostile status."""
              active = active_combat_for_person(read_json, player_id)
              if active is None:
                  return None
              combat_ref, combat = active
              if not isinstance(combat, Mapping):
                  return None
              sides = combat.get("sides", {})
              combatants = combat.get("combatants", {})
              if not isinstance(sides, Mapping) or not isinstance(combatants, Mapping):
                  return None

              player_side_ref: str | None = None
              player_side_members: list[str] = []
              enemy_refs: list[str] = []
              for side_ref, raw_members in sides.items():
                  members = _unique_person_refs(raw_members)
                  if player_id in members:
                      player_side_ref = str(side_ref)
                      player_side_members = members
                      break
              if player_side_ref is None:
                  return None
              for side_ref, raw_members in sides.items():
                  if str(side_ref) == player_side_ref:
                      continue
                  for ref in _unique_person_refs(raw_members):
                      if ref not in enemy_refs:
                          enemy_refs.append(ref)
              enemy_set = set(enemy_refs)

              def status_families(ref: str) -> set[str]:
                  state = combatants.get(ref, {})
                  if not isinstance(state, Mapping):
                      return set()
                  return {str(value) for value in state.get("status_families", []) if isinstance(value, str)}

              def body_present(ref: str) -> bool:
                  return combat_person_arrived(combat, ref) and not ({"escaped", "ring_out"} & status_families(ref))

              def combat_active(ref: str) -> bool:
                  return body_present(ref) and not ({"dead", "incapacitated", "unconscious"} & status_families(ref))

              friendly_bodies = [ref for ref in player_side_members if body_present(ref)]
              friendly_active = [ref for ref in friendly_bodies if combat_active(ref)]
              friendly_dead = [ref for ref in friendly_bodies if "dead" in status_families(ref)]
              friendly_incapacitated = [
                  ref for ref in friendly_bodies
                  if "dead" not in status_families(ref)
                  and bool({"incapacitated", "unconscious"} & status_families(ref))
              ]

              def observer_summary(observer_ref: str) -> dict[str, Any]:
                  state = combatants.get(observer_ref, {})
                  observed = _unique_person_refs(state.get("observed_refs")) if isinstance(state, Mapping) else []
                  confirmed_count = sum(1 for ref in observed if ref in enemy_set)
                  return {
                      "observer_person_id": observer_ref,
                      "confirmed_observed_hostile_count": confirmed_count,
                  }

              def hostile_status_summary(observer_ref: str) -> dict[str, Any]:
                  state = combatants.get(observer_ref, {})
                  observed = _unique_person_refs(state.get("observed_refs")) if isinstance(state, Mapping) else []
                  snapshots = state.get("observed_status_families", {}) if isinstance(state, Mapping) else {}
                  snapshots = snapshots if isinstance(snapshots, Mapping) else {}
                  capable = wounded = incapacitated = dead = unknown = 0
                  for ref in observed:
                      if ref not in enemy_set:
                          continue
                      if ref not in snapshots or not isinstance(snapshots.get(ref), list):
                          unknown += 1
                          continue
                      statuses = {str(value) for value in snapshots.get(ref, []) if isinstance(value, str)}
                      if "dead" in statuses:
                          dead += 1
                      elif {"incapacitated", "unconscious"} & statuses:
                          incapacitated += 1
                      elif {"escaped", "ring_out"} & statuses:
                          unknown += 1
                      else:
                          capable += 1
                          if "wounded" in statuses:
                              wounded += 1
                  return {
                      "observer_person_id": observer_ref,
                      "last_observed_combat_capable_hostile_count": capable,
                      "last_observed_wounded_hostile_count": wounded,
                      "last_observed_incapacitated_hostile_count": incapacitated,
                      "last_observed_dead_hostile_count": dead,
                      "last_observed_status_unknown_count": unknown,
                      "status_semantics": "last_direct_observation_only_no_hidden_current_status",
                  }

              player_observation = observer_summary(player_id)
              player_status = hostile_status_summary(player_id)
              limit = max(0, min(24, int(ally_limit)))
              ally_observers: list[dict[str, Any]] = []
              ally_status_observers: list[dict[str, Any]] = []
              if limit:
                  for ref in friendly_active:
                      if ref == player_id:
                          continue
                      ally_observers.append(observer_summary(ref))
                      ally_status_observers.append(hostile_status_summary(ref))
                      if len(ally_observers) >= limit:
                          break

              return {
                  "combat_ref": combat_ref,
                  "friendly_participant_person_ids": friendly_active,
                  "friendly_participant_count": len(friendly_active),
                  "friendly_presence_semantics": "arrived_active_exact_combat_participants_only",
                  "friendly_body_person_ids": friendly_bodies,
                  "friendly_body_count": len(friendly_bodies),
                  "friendly_body_semantics": "arrived_physical_bodies_including_casualties",
                  "friendly_dead_person_ids": friendly_dead,
                  "friendly_dead_count": len(friendly_dead),
                  "friendly_incapacitated_person_ids": friendly_incapacitated,
                  "friendly_incapacitated_count": len(friendly_incapacitated),
                  "player_observation": player_observation,
                  "player_hostile_status_observation": player_status,
                  "ally_observer_summaries": ally_observers,
                  "ally_hostile_status_observer_summaries": ally_status_observers,
                  "knowledge_semantics": "observer_specific_not_automatically_shared",
                  "count_semantics": "confirmed_observed_hostiles_not_total_force",
                  "count_temporality_semantics": "confirmed_count_is_historical_identity_detection_not_current_active_force",
              }
          '''
              travel = between(travel, 'def combat_observation_scene_projection(', '\n\ndef movement_scene_projection', projection)
              block_start = travel.index('            if combat_observation is not None:')
              block_end = travel.index('\n            if movement is not None:', block_start)
              block = '''            if combat_observation is not None:
                              scene["combat_observation_context"] = combat_observation
                              combat_present = _unique_person_refs(
                                  combat_observation.get("friendly_participant_person_ids")
                              )
                              combat_bodies = _unique_person_refs(
                                  combat_observation.get("friendly_body_person_ids")
                              )
                              present: list[str] = []
                              existing_present = scene.get("present_person_ids", [])
                              for ref in ([*existing_present] if isinstance(existing_present, list) else []) + combat_bodies:
                                  if isinstance(ref, str) and ref and ref not in present:
                                      present.append(ref)
                              scene["present_person_ids"] = present
                              scene["combat_present_person_ids"] = combat_present
                              scene["combat_body_person_ids"] = combat_bodies
                              for ref in combat_bodies:
                                  if ref not in suggested:
                                      suggested.append(ref)
                              person_reads["combat_participant_use"] = (
                                  "combat_present_person_ids are exact arrived friendly fighters still able to act. "
                                  "combat_body_person_ids are the arrived physical bodies and may include dead or incapacitated allies; "
                                  "registered future reinforcements are not co-present yet."
                              )
                              person_reads["combat_observer_use"] = (
                                  "confirmed_observed_hostile_count is the number of hostile identities that observer has detected at least once, "
                                  "not the number still fighting. Use the matching hostile status observation only as last directly observed condition; "
                                  "never promote an ally observation or hidden current status into Wei's knowledge."
                              )
          '''
              travel = travel[:block_start] + block + travel[block_end:]
              travel_path.write_text(travel)

          obs_test_path = Path('tests/current/test_combat_observation_projection.py')
          obs_tests = obs_test_path.read_text()
          if 'test_legacy_observed_hostile_status_stays_unknown' not in obs_tests:
              obs_tests += '''\n\ndef test_legacy_observed_hostile_status_stays_unknown_without_hidden_state_leak():
              combat = _combat(player_observed=["enemy.1"], ally_observed=[])
              combat["combatants"]["enemy.1"]["status_families"] = ["dead"]
              result = combat_observation_scene_projection(read_json=_reader(combat), player_id="pc")
              status = result["player_hostile_status_observation"]
              assert status["last_observed_dead_hostile_count"] == 0
              assert status["last_observed_status_unknown_count"] == 1


def test_last_observed_hostile_status_projects_aggregate_casualties_without_ids():
              combat = _combat(player_observed=["enemy.1", "enemy.2"], ally_observed=[])
              combat["combatants"]["pc"]["observed_status_families"] = {
                  "enemy.1": ["dead"],
                  "enemy.2": ["wounded"],
              }
              result = combat_observation_scene_projection(read_json=_reader(combat), player_id="pc")
              status = result["player_hostile_status_observation"]
              assert status["last_observed_dead_hostile_count"] == 1
              assert status["last_observed_wounded_hostile_count"] == 1
              assert status["last_observed_combat_capable_hostile_count"] == 1
              assert status["last_observed_status_unknown_count"] == 0
              encoded = json.dumps(result, sort_keys=True)
              assert "enemy.1" not in encoded and "enemy.2" not in encoded and "enemy.3" not in encoded


def test_friendly_casualty_body_is_not_projected_as_active_fighter():
              combat = _combat(player_observed=[], ally_observed=[])
              combat["combatants"]["ally"]["status_families"] = ["incapacitated"]
              result = combat_observation_scene_projection(read_json=_reader(combat), player_id="pc")
              assert result["friendly_participant_person_ids"] == ["pc"]
              assert result["friendly_body_person_ids"] == ["pc", "ally"]
              assert result["friendly_incapacitated_person_ids"] == ["ally"]
              assert result["friendly_incapacitated_count"] == 1
          '''
              obs_test_path.write_text(obs_tests)

          geometry_path = Path('tests/current/test_combat_geometry.py')
          geometry = geometry_path.read_text()
          if 'test_initial_observation_excludes_future_enemy_reinforcement' not in geometry:
              geometry += '''\n\ndef test_initial_observation_excludes_future_enemy_reinforcement():
              roster=load('state/martial-world/people/house_tang.json')['people']
              observer=copy.deepcopy(roster[0]); enemy=copy.deepcopy(roster[3]); future=copy.deepcopy(roster[4])
              people={row['person_id']:row for row in (observer,enemy,future)}
              combat=initialize_combat(
                  combat_ref='observation-reinforcement',side_a_refs=[observer['person_id']],
                  side_b_refs=[enemy['person_id'],future['person_id']],people=people,
                  zone_ref='site.house_tang',started_at='x',objective={'kind':'eliminate'},
                  reinforcement_delays_ms={future['person_id']:5000},
              )
              state=combat['combatants'][observer['person_id']]
              assert enemy['person_id'] in state['observed_refs']
              assert future['person_id'] not in state['observed_refs']
              assert future['person_id'] not in state['observed_status_families']


def test_direct_observation_refreshes_enemy_casualty_snapshot():
              import shinobi_runtime.martial_world.exact_combat as exact
              roster=load('state/martial-world/people/house_tang.json')['people']
              observer=copy.deepcopy(roster[0]); enemy=copy.deepcopy(roster[3])
              people={observer['person_id']:observer,enemy['person_id']:enemy}
              combat=initialize_combat(
                  combat_ref='observation-casualty',side_a_refs=[observer['person_id']],
                  side_b_refs=[enemy['person_id']],people=people,zone_ref='site.house_tang',
                  started_at='x',objective={'kind':'eliminate'},
              )
              enemy['health']['status']='dead'; enemy['health']['consciousness']=0
              combat['combatants'][enemy['person_id']]['status_families']=['dead']
              seen=exact._observe_visible_enemies(
                  combat,actor_ref=observer['person_id'],enemy_refs=[enemy['person_id']],
                  people=people,at_ms=1000,
              )
              assert seen == [enemy['person_id']]
              assert 'dead' in combat['combatants'][observer['person_id']]['observed_status_families'][enemy['person_id']]
          '''
              geometry_path.write_text(geometry)

          skill_path = Path('plugins/shinobi-rpg/skill/shinobi-game-master/references/combat.md')
          skill = skill_path.read_text()
          if 'combat_body_person_ids' not in skill:
              old = 'When `scene.combat_present_person_ids` exists, treat it as the exact player-safe friendly cast that has actually reached the active combat space. Prefer it over stale `state/scene.json` cast memory, route membership, mission rosters, or `person_reads.suggested_owner_ids` when deciding which allies can physically speak, protect, be addressed, or otherwise participate in the immediate battle scene. A registered future reinforcement is reserved for the combat but is **not co-present** until its exact reinforcement clock arrives.'
              new = 'When `scene.combat_present_person_ids` exists, treat it as the exact player-safe friendly cast that has arrived and is still able to act. `scene.combat_body_person_ids` is the physical arrived cast and may also contain dead or incapacitated allies who remain bodies in the combat space. Prefer the active cast when deciding who can speak, protect, or act, and use the body cast for physical/casualty grounding. A registered future reinforcement is reserved for the combat but is **not co-present** until its exact reinforcement clock arrives.'
              assert old in skill
              skill = skill.replace(old, new, 1)
              old = '`confirmed_observed_hostile_count` means exactly what that observer has detected among the current hostile combatants. It is an observed count, not a guarantee that no additional enemy exists outside the observer\'s knowledge or outside the current combat space. Never expose hidden hostile IDs or substitute the hidden opposing roster size for an observer\'s count.'
              new = '`confirmed_observed_hostile_count` is a historical identity count: it means how many hostile identities that observer has directly detected at least once in the current combat, not how many are still active now. Use the matching hostile-status observation for last directly observed capable, wounded, incapacitated, dead, or unknown counts. Those status counts remain observer-specific snapshots and must never be refreshed from hidden current hostile truth merely because the Runtime knows it. Never expose hidden hostile IDs or substitute the hidden opposing roster size for an observer\'s count.'
              assert old in skill
              skill = skill.replace(old, new, 1)
              skill_path.write_text(skill)
          PY
