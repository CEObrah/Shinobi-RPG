name: OOC DEV checks

on:
  pull_request:
  push:
    branches:
      - fix/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[service,service-test]'
      - name: Quick structural and command checks
        id: quick
        shell: bash
        run: |
          set +e
          python tools/quick_check.py > quick-check.log 2>&1
          code=$?
          cat quick-check.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Changed-owner regressions
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set +e
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BASE_SHA"
            head="$CURRENT_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          if [[ -z "$head" ]]; then
            head="$(git rev-parse HEAD)"
          fi
          mapfile -t changed_files < <(git diff --name-only "$base" "$head")
          printf 'CHANGED FILE: %s\n' "${changed_files[@]}"
          python tools/test_changed.py "${changed_files[@]}" > changed-tests.log 2>&1
          code=$?
          cat changed-tests.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Battle repair and route regressions
        id: regressions
        shell: bash
        run: |
          set +e
          pytest -q \
            tests/current/test_combat_simulation_hardening.py \
            tests/current/test_combat_frontage_targeting.py \
            tests/current/test_combat_frontage_live_semantics.py \
            tests/current/test_combat_pressure_integrity.py \
            tests/current/test_combat_readiness_integrity.py \
            tests/current/test_combat_liveness_integrity.py \
            tests/current/test_combat_reaction_window_causality.py \
            tests/current/test_combat_reaction_timing_integrity.py \
            tests/current/test_combat_reaction_window_causality_ci_contract.py \
            tests/current/test_combat_command_wrapper.py \
            tests/current/test_player_retinue_doctrine.py \
            tests/current/test_combat_rally_and_approach_budget.py \
            tests/current/test_combat_defense_timing_integrity.py \
            tests/current/test_field_stabilization_command.py \
            tests/current/test_live_active_combat_preview_contract.py \
            tests/current/test_live_combat_ally_support.py \
            tests/current/test_person_sheet_trauma_projection.py \
            tests/current/test_packaged_battle_repair_anchor.py \
            tests/current/test_pre_root_historical_repair.py \
            tests/current/test_resolved_route_contact_reconciliation.py \
            tests/current/test_live_combat_route_rebase.py \
            tests/current/test_semantic_wait_and_time_flow.py \
            tests/current/test_runtime_invariants.py \
            tests/current/test_release_surface.py \
            > route-regressions.log 2>&1
          code=$?
          cat route-regressions.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ooc-dev-check-logs
          path: |
            quick-check.log
            changed-tests.log
            route-regressions.log
      - name: Enforce checks
        shell: bash
        run: |
          test "${{ steps.quick.outputs.exit_code }}" = "0"
          test "${{ steps.changed.outputs.exit_code }}" = "0"
          test "${{ steps.regressions.outputs.exit_code }}" = "0"
