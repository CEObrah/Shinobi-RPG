name: Structural Hardening

on:
  push:
    branches:
      - maintenance/stable-gameplay-names

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[structural-hardening]') && !contains(github.event.head_commit.message, '[structural-coverage-report]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - name: Apply structural hardening
        run: python tools/apply_structural_hardening.py
      - name: Validate full repository
        run: |
          python tools/test_transaction_integrity.py
          python tools/audit.py
          python tools/test_gameplay_naming.py
          python tools/test_development.py
          python tools/test_mechanics.py
          python tools/test_living_world.py
          python tools/test_runtime.py
          python tools/test_semantics.py
          python tools/test_unit_model.py
          python tools/test_reputation.py
          python tools/test_family.py
          python tools/test_team_consistency.py
          python tools/test_house_tang_martial.py
          python tools/test_templates.py
          python tools/test_structural_determinism.py
          python tools/test_routing.py
      - name: Keep normal workflow wiring out of bot commit
        run: git checkout -- .github/workflows/audit.yml
      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[structural-hardening] Register blank owner skeletons and write contracts"
          git push origin HEAD:maintenance/stable-gameplay-names
