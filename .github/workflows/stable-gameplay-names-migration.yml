name: Stable Gameplay Names Migration

on:
  push:
    branches:
      - maintenance/stable-gameplay-names

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[stable-gameplay-migration]') && !contains(github.event.head_commit.message, '[migration-failure-log]') && !contains(github.event.head_commit.message, '[validation-failure-log]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - name: Apply stable gameplay naming migration
        id: migrate
        shell: bash
        run: |
          set -o pipefail
          rm -f maintenance/gameplay-version-audit.json
          rm -f maintenance/migration-failure.log
          rm -f maintenance/validation-failure.log
          python - <<'PY'
          import json
          from pathlib import Path

          VERSION_KEYS = {'version', 'schema_version', 'game_version', 'rules_version', 'data_version'}

          def strip_schema_versions(value):
              changed = False
              if isinstance(value, dict):
                  required = value.get('required')
                  if isinstance(required, list):
                      new = [x for x in required if str(x).lower() not in VERSION_KEYS]
                      if new != required:
                          value['required'] = new
                          changed = True
                  props = value.get('properties')
                  if isinstance(props, dict):
                      for key in list(props):
                          if str(key).lower() in VERSION_KEYS:
                              del props[key]
                              changed = True
                          elif strip_schema_versions(props[key]):
                              changed = True
                  for key, item in list(value.items()):
                      if key in {'required', 'properties'}:
                          continue
                      if strip_schema_versions(item):
                          changed = True
              elif isinstance(value, list):
                  for item in value:
                      if strip_schema_versions(item):
                          changed = True
              return changed

          registry_path = Path('schemas/registry.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          registry.pop('tech-index.v38', None)

          for template_path in Path('data/runtime/templates').glob('*.json'):
              template = json.loads(template_path.read_text(encoding='utf-8'))
              dirs = template.get('current_directories', []) if isinstance(template, dict) else []
              gameplay = isinstance(dirs, list) and any(
                  isinstance(d, str) and (d.startswith('state/') or (d.startswith('data/') and not d.startswith('data/runtime/')))
                  for d in dirs
              )
              if not gameplay:
                  continue
              source = template.get('source_schema')
              if not source:
                  target = template.get('target_schema')
                  filename = registry.get(target)
                  if filename:
                      source = f'schemas/{filename}'
              if not source:
                  continue
              schema_path = Path(source)
              if not schema_path.exists():
                  continue
              schema = json.loads(schema_path.read_text(encoding='utf-8'))
              if strip_schema_versions(schema):
                  schema_path.write_text(json.dumps(schema, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          registry_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          audit_path = Path('tools/audit.py')
          audit = audit_path.read_text(encoding='utf-8')
          audit = audit.replace("_version=(ROOT/'VERSION').read_text(encoding='utf-8').strip()\nif meta.get('version')!=_version:err(f'meta_version:{meta.get(\"version\")}!={_version}')\n", '')
          audit_path.write_text(audit, encoding='utf-8')
          PY
          python tools/migrate_stable_gameplay_names.py 2>&1 | tee /tmp/stable-name-migration.log
      - name: Publish migration failure
        if: ${{ failure() && steps.migrate.outcome == 'failure' }}
        shell: bash
        run: |
          git reset --hard HEAD
          mkdir -p maintenance
          cp /tmp/stable-name-migration.log maintenance/migration-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maintenance/migration-failure.log
          git commit -m "[migration-failure-log] Capture stable naming failure"
          git push origin HEAD:maintenance/stable-gameplay-names
      - name: Remove temporary migration machinery
        run: |
          rm -f tools/migrate_stable_gameplay_names.py
          rm -f .github/workflows/stable-gameplay-names-migration.yml
          rm -f tools/audit_gameplay_versions.py
          rm -f maintenance/gameplay-version-audit.json
          rm -f maintenance/migration-failure.log
          rm -f maintenance/validation-failure.log
          rmdir maintenance 2>/dev/null || true
          git add -A
      - name: Validate migrated repository
        id: validate
        shell: bash
        run: |
          set -o pipefail
          (
            set -e
            python tools/test_transaction_integrity.py
            python tools/audit.py
            python tools/test_gameplay_naming.py
            python tools/test_development.py
            python tools/test_mechanics.py
            python tools/test_living_world.py
            python tools/test_runtime.py
            python tools/test_semantics.py
            python tools/test_unit_model.py
            python tools/test_reputation.py
            python tools/test_family.py
            python tools/test_team_consistency.py
            python tools/test_house_tang_martial.py
            python tools/test_templates.py
            python tools/test_routing.py
          ) 2>&1 | tee /tmp/stable-name-validation.log
      - name: Publish validation failure
        if: ${{ failure() && steps.validate.outcome == 'failure' }}
        shell: bash
        run: |
          git reset --hard HEAD
          mkdir -p maintenance
          cp /tmp/stable-name-validation.log maintenance/validation-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maintenance/validation-failure.log
          git commit -m "[validation-failure-log] Capture stable naming validation failure"
          git push origin HEAD:maintenance/stable-gameplay-names
      - name: Commit migrated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[stable-gameplay-migration] Use stable gameplay names"
          git push origin HEAD:maintenance/stable-gameplay-names
