name: OOC DEV Systemic Combat Range Narration

on:
  push:
    branches: [fix/systemic-combat-range-narration-20260831]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/systemic-combat-range-narration-20260831
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[service,service-test]'

      - name: Normalize patch to maintained test tree
        run: |
          mkdir -p tests/current
          sed -i 's#tests/runtime/test_systemic_combat_range_narration.py#tests/current/test_systemic_combat_range_narration.py#g' tools/_ooc_dev_systemic_combat_range_narration.py

      - name: Apply systemic OOC DEV patch
        run: python tools/_ooc_dev_systemic_combat_range_narration.py

      - name: Isolate reaction-budget regression to reaction kernel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/current/test_combat_geometry.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def test_three_attackers_share_one_reaction_budget_in_exact_exchange')
          end = text.index('\ndef test_three_vs_three_teammates_create_real_defensive_interruptions', start)
          replacement = '''def test_three_attackers_share_one_reaction_budget_in_exact_exchange():
              from shinobi_runtime.martial_world.combat import active_defense_available, commit_active_defense

              # This regression owns only the shared active-defense state machine.
              # Planner roles, approach lanes, targeting and contact geometry have
              # separate tests and must not decide whether this test gets three
              # committed threats to measure.
              state={}
              pressures=[]
              for idx,angle in enumerate((0,90,180)):
                  attacker_ref=f'attacker.{idx}'
                  pressure=active_defense_available(
                      state,
                      attacker_ref=attacker_ref,
                      at_ms=1000,
                      reaction_score=300,
                      angle_deg=angle,
                      balance_milli=1000,
                      limb_commitment_milli=0,
                  )
                  pressures.append(pressure)
                  committed=commit_active_defense(
                      pressure['state_after_decay'],
                      attacker_ref=attacker_ref,
                      at_ms=1000,
                      threat_speed=100,
                      reaction_score=300,
                      body_commitment_milli=200,
                  )
                  state=committed['state_after']

              distinct=[int(row['distinct_attackers']) for row in pressures]
              available=[int(row['available_milli']) for row in pressures]
              assert distinct == [1,2,3]
              assert available[1] < available[0]
              assert available[2] <= available[1]
              assert set(state['recent_attackers']) == {'attacker.0','attacker.1','attacker.2'}


          '''
          # Dedent the embedded source while keeping the YAML heredoc readable.
          import textwrap
          replacement=textwrap.dedent(replacement)
          path.write_text(text[:start] + replacement + text[end+1:], encoding='utf-8')
          PY

      - name: Prove no campaign state edits
        run: |
          if git diff --name-only | grep -q '^state/'; then
            echo 'Refusing source repair with state edits.' >&2
            git diff --name-only >&2
            exit 1
          fi

      - name: Focused systemic combat regressions
        run: |
          pytest -q \
            tests/current/test_systemic_combat_range_narration.py \
            tests/current/test_combat_geometry.py::test_three_attackers_share_one_reaction_budget_in_exact_exchange \
            tests/current/test_combat_contact_pursuit_repair.py \
            tests/current/test_combat_rally_and_approach_budget.py \
            tests/current/test_combat_lethal_pursuit_repair.py

      - name: Repository gates
        run: |
          python tools/quick_check.py
          python tools/verify_jianghu_semantics.py
          python tools/audit_state_bloat.py
          python tools/verify_noop_roundtrip.py

      - name: Changed-owner regression gate
        run: |
          python tools/test_changed.py \
            runtime/shinobi_runtime/martial_world/exact_combat.py \
            runtime/shinobi_runtime/api/transition_operations.py \
            runtime/shinobi_runtime/api/travel_operations.py \
            plugins/shinobi-rpg/skill/shinobi-game-master/references/combat.md \
            tests/current/test_systemic_combat_range_narration.py \
            tests/current/test_combat_geometry.py

      - name: Commit only tested product changes
        shell: bash
        run: |
          rm -f \
            tools/_ooc_dev_systemic_combat_range_narration.py \
            tools/_ooc_dev_systemic_trigger.txt \
            .github/workflows/ooc-dev-systemic-combat-range-narration.yml \
            ooc-dev-systemic-patch-failure.log \
            ooc-dev-test-changed-failure.log
          git diff --check
          if git diff --name-only | grep -q '^state/'; then
            echo 'State edit appeared before commit.' >&2
            exit 1
          fi
          git config user.name 'Shinobi OOC DEV'
          git config user.email 'ooc-dev@invalid'
          git add -A
          git commit -m 'Fix systemic combat range and narration transport'
          git push origin HEAD:fix/systemic-combat-range-narration-20260831
