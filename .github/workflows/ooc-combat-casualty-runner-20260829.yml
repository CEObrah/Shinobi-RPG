name: OOC combat casualty projection runner

on:
  push:
    branches:
      - fix/combat-casualty-projection-20260829

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and apply repair script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/ooc-combat-casualty-projection-20260829.yml').read_text().splitlines()
          start = source.index('          from pathlib import Path')
          end = source.index('          PY', start)
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          Path('/tmp/patch_combat_casualty.py').write_text(code)
          PY
          python /tmp/patch_combat_casualty.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fast repository gate
        run: python tools/quick_check.py
      - name: Changed-system regression selection
        run: python tools/test_changed.py runtime/shinobi_runtime/martial_world/exact_combat.py runtime/shinobi_runtime/api/travel_operations.py tests/current/test_combat_observation_projection.py tests/current/test_combat_presence_projection.py tests/current/test_combat_geometry.py
      - name: Focused casualty projection tests
        run: python -m pytest -q tests/current/test_combat_observation_projection.py tests/current/test_combat_presence_projection.py tests/current/test_combat_geometry.py
      - name: Diff hygiene
        run: git diff --check
      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/shinobi_runtime/martial_world/exact_combat.py runtime/shinobi_runtime/api/travel_operations.py tests/current/test_combat_observation_projection.py tests/current/test_combat_geometry.py plugins/shinobi-rpg/skill/shinobi-game-master/references/combat.md
          git diff --cached --quiet && exit 0
          git commit -m "Fix exact-combat casualty projection"
          git push origin HEAD:${GITHUB_REF_NAME}
