name: verify

on:
  push:
    branches: [main]
    paths-ignore:
      - 'state/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[service,service-test]'
      - name: Fast structural gate
        run: python tools/quick_check.py
      - name: Runtime regression suite
        run: python -m pytest -q -p no:cacheprovider tests/current
