name: Verify Shinobi Jianghu

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shinobi-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-gate:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[aug26-sync]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[service,service-test]'

      - name: Fast structure and command-surface gate
        run: python tools/quick_check.py

      - name: Jianghu world semantic invariants
        run: python tools/verify_jianghu_semantics.py

      - name: Hot-state bloat and authority separation
        run: python tools/audit_state_bloat.py

      - name: Deterministic no-op round trip
        run: python tools/verify_noop_roundtrip.py

      - name: Changed-system regressions
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          else
            base=""
          fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            mapfile -t changed < <(git diff --name-only "$base" "$GITHUB_SHA")
          elif [ -n "${GITHUB_SHA:-}" ]; then
            mapfile -t changed < <(git show --pretty='' --name-only "$GITHUB_SHA")
          else
            changed=()
          fi
          python tools/test_changed.py "${changed[@]}"

  sync-aug26-main:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[aug26-sync]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out audited patch payload
        uses: actions/checkout@v4
        with:
          ref: audit/retinue-doctrine-poison-2026-08-26
          path: _sync_payload
          sparse-checkout: |
            .sync-patch
          sparse-checkout-cone-mode: false

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat _sync_payload/.sync-patch/part-* | base64 -d > /tmp/update.patch.xz
          echo '1dfa1585f6050952e7a3f4259120c828bb0438299cadf7465d870bc18e44c200  /tmp/update.patch.xz' | sha256sum -c -
          xz -dc /tmp/update.patch.xz > /tmp/update.patch
          echo 'd969ac2501f4a4ac69af83e0ac2c9042b285e3ce5df7f485ab4d0c47dfe44463  /tmp/update.patch' | sha256sum -c -

      - name: Apply audited Aug 26 delta
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _sync_payload
          if git apply --check /tmp/update.patch; then
            git apply --whitespace=nowarn /tmp/update.patch
          else
            patch --batch --forward --fuzz=3 -p1 < /tmp/update.patch
          fi
          rm -f .aug26-sync-trigger
          rm -f .github/workflows/apply-aug26-sync.yml
          git show bd26014c7a9b376caa3fd03867621a14df39ea8c:.github/workflows/verify.yml > .github/workflows/verify.yml
          git diff --check
          git status --short

      - name: Commit and push final main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CEObrah'
          git config user.email '107764892+CEObrah@users.noreply.github.com'
          git add -A
          git commit -m 'Sync Aug 26 retinue doctrine poison and Qi repair'
          git push origin HEAD:main
